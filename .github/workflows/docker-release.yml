name: Docker Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/fraternity-z/mathstudyplatform-backend
  FRONTEND_IMAGE: ghcr.io/fraternity-z/mathstudyplatform-frontend

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected format: v1.0.0"
            exit 1
          fi

      - name: Ensure GitHub Release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release '$VERSION' already exists. Choose a new version."
            exit 1
          fi

  release:
    name: Publish Docker images and GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure version tags do not already exist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          existing_tags=()
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              existing_tags+=("$image:$VERSION")
            fi
          done

          if (( ${#existing_tags[@]} > 0 )); then
            printf -v existing_list '%s, ' "${existing_tags[@]}"
            echo "::error::Release version '$VERSION' already exists: ${existing_list%, }. Choose a new version; latest may be updated, but version tags are immutable."
            exit 1
          fi

      - name: Generate backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-build.outputs.digest }}
        run: |
          {
            echo "## Published Docker images"
            echo
            echo "Built from commit \`$GITHUB_SHA\`."
            echo
            echo "### Backend"
            printf -- '- `%s`\n' $BACKEND_TAGS
            echo
            echo "Digest: \`$BACKEND_DIGEST\`"
            echo
            echo "### Frontend"
            printf -- '- `%s`\n' $FRONTEND_TAGS
            echo
            echo "Digest: \`$FRONTEND_DIGEST\`"
          } > release-notes.md

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

      - name: Report published image tags
        shell: bash
        env:
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          release_url=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            echo "## Published Docker images"
            echo
            echo "### Backend"
            printf -- '- `%s`\n' $BACKEND_TAGS
            echo
            echo "### Frontend"
            printf -- '- `%s`\n' $FRONTEND_TAGS
            echo
            echo "### GitHub Release"
            echo "- $release_url"
          } | tee -a "$GITHUB_STEP_SUMMARY"
